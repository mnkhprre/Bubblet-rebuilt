name: Release packages (macOS + Debian)

# Builds the macOS DMG and the Debian package and attaches them to a release.
# Runs automatically when a release is published; can also be started by hand
# for an existing release tag (Actions -> Release packages -> Run workflow).
on:
  pull_request:
    paths:
      - "Bubblet!/**"
      - ".github/workflows/release-packages.yml"
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the packages to (e.g. v1.2.0)"
        required: true

permissions:
  contents: write

env:
  # Empty on pull requests: packages are built and tested but not uploaded.
  TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  macos-app:
    name: macOS app (${{ matrix.arch }})
    strategy:
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: "Bubblet!"
    steps:
      - uses: actions/checkout@v5
      - name: Install dependencies
        run: brew install sdl2 sdl2_mixer sdl2_ttf dylibbundler
      - name: Build app
        run: bash packaging/build_macos.sh "$(bash packaging/version.sh)"
      - name: Smoke test (app starts and stays up)
        run: |
          open -n dist/mac/Bubblet.app
          sleep 8
          pgrep -x bubblet_mac
          pkill -x bubblet_mac || true
      - name: Pack app
        run: tar -czf "dist/Bubblet-${{ matrix.arch }}.app.tgz" -C dist/mac Bubblet.app
      - uses: actions/upload-artifact@v5
        with:
          name: macos-app-${{ matrix.arch }}
          path: "Bubblet!/dist/Bubblet-${{ matrix.arch }}.app.tgz"

  macos:
    name: macOS DMG (Universal)
    needs: macos-app
    runs-on: macos-15
    defaults:
      run:
        working-directory: "Bubblet!"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          pattern: macos-app-*
          path: "Bubblet!/dist/in"
          merge-multiple: true
      - name: Unpack apps
        run: |
          mkdir -p dist/arm64 dist/x86_64
          tar -xzf dist/in/Bubblet-arm64.app.tgz -C dist/arm64
          tar -xzf dist/in/Bubblet-x86_64.app.tgz -C dist/x86_64
      - name: Build universal DMG
        run: bash packaging/make_universal_dmg.sh "$(bash packaging/version.sh)" dist/arm64/Bubblet.app dist/x86_64/Bubblet.app
      - name: Smoke test (universal app starts)
        run: |
          open -n dist/universal/Bubblet.app
          sleep 8
          pgrep -x bubblet_mac
          pkill -x bubblet_mac || true
      - uses: actions/upload-artifact@v5
        with:
          name: macos-dmg
          path: "Bubblet!/dist/*.dmg"
      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/*.dmg --clobber --repo "${{ github.repository }}"

  debian:
    name: Debian package (amd64)
    runs-on: ubuntu-latest
    # Ubuntu 22.04 userland keeps the binary compatible with Debian 12 and Ubuntu 22.04+
    container: ubuntu:22.04
    defaults:
      run:
        working-directory: "Bubblet!"
    steps:
      - name: Install dependencies
        working-directory: /
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential pkg-config libsdl2-dev libsdl2-mixer-dev libsdl2-ttf-dev \
            libcurl4-openssl-dev icoutils git ca-certificates curl gpg
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update && apt-get install -y gh
      - uses: actions/checkout@v5
      - name: Build .deb
        run: bash packaging/build_deb.sh "$(bash packaging/version.sh)"
      - name: Check package
        run: |
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb | grep -E "usr/games/bubblet|usr/lib/bubblet/bubblet|bubblet.desktop"
      - name: Install test
        run: |
          DEBIAN_FRONTEND=noninteractive apt-get install -y ./dist/*.deb
          test -x /usr/games/bubblet
          ldd /usr/lib/bubblet/bubblet | (! grep "not found")
      - uses: actions/upload-artifact@v5
        with:
          name: debian-deb
          path: "Bubblet!/dist/*.deb"
      - name: Attach to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gh release upload "$TAG" dist/*.deb --clobber --repo "${{ github.repository }}"
